<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../up.css">
<script src="../up.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResultList · Software UP</title>
<style>
body{padding:24px}
.ds-sec+.ds-sec{margin-top:28px}
.ds-cap{margin:0 0 10px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.ds-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ds-row--top{align-items:flex-start}
.ds-col{display:flex;flex-direction:column;gap:16px}
.ds-state{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ds-state>small{font-size:12px;line-height:16px;color:var(--text-muted)}
.ds-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.ds-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}

</style>
</head>
<body>

<div style="max-width:460px"><section class="up-card" aria-labelledby="rr-t">
  <div class="up-card__head"><h2 class="up-section__title" id="rr-t">Resultados recentes</h2><a class="up-link-arrow" href="#">Ver histórico<span class="up-icon" data-icon="arrow-right"></span></a></div>
  <ul class="up-results">
    <li class="up-result"><span class="up-tile up-tile--primary"><span class="up-icon" data-icon="clipboard-check"></span></span><div class="up-result__body"><p class="up-result__title">Diagnóstico UP <span class="up-badge up-badge--sm up-badge--success">Refeito</span></p><p class="up-result__meta">12/10/2026</p></div><a class="up-btn up-btn--sm up-btn--primary" href="#">Abrir</a></li>
    <li class="up-result"><span class="up-tile up-tile--accent"><span class="up-icon" data-icon="chart-bar"></span></span><div class="up-result__body"><p class="up-result__title">Raio-X financeiro <span class="up-badge up-badge--sm up-badge--info">Outubro</span></p><p class="up-result__meta">Salvo em 20/10/2026</p></div><a class="up-btn up-btn--sm up-btn--secondary" href="#">Abrir</a></li>
    <li class="up-result"><span class="up-tile up-tile--primary"><span class="up-icon" data-icon="clipboard-check"></span></span><div class="up-result__body"><p class="up-result__title">Diagnóstico UP <span class="up-badge up-badge--sm up-badge--outline">Inicial</span></p><p class="up-result__meta">05/05/2026</p></div><a class="up-btn up-btn--sm up-btn--secondary" href="#">Comparar</a></li>
  </ul>
</section></div>
<script>window.UP && window.UP.hydrate();</script>
</body>
</html>
